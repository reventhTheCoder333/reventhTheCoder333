name: Update bounty board

on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch:
  push:
    paths:
      - scripts/bounty-board.mjs

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render bounty board
        run: node scripts/bounty-board.mjs ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bounty-board.svg
          git diff --cached --quiet || git commit -m "chore: refresh bounty board"
          git push
