<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Reventh Sathish Kumar — The Grand Line">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071B2B"/>
      <stop offset=".5" stop-color="#0F3044"/>
      <stop offset=".82" stop-color="#6E4433"/>
      <stop offset="1" stop-color="#D97941"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F3C98A"/>
      <stop offset=".4" stop-color="#E39A5C" stop-opacity=".8"/>
      <stop offset="1" stop-color="#D97941" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B6570"/>
      <stop offset="1" stop-color="#071B2B"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" stroke="#C6A15B" stroke-opacity=".06"/>
    </pattern>
    <style>
      .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif; }
      .wave { animation: drift 9s ease-in-out infinite alternate; }
      .glint { animation: glint 4s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
      @keyframes glint { from { opacity: .35; } to { opacity: .8; } }
      @media (prefers-reduced-motion: reduce) { .wave, .glint { animation: none; } }
    </style>
  </defs>

  <!-- sky & chart grid -->
  <rect width="1200" height="236" fill="url(#sky)"/>
  <rect width="1200" height="236" fill="url(#grid)"/>
  <g fill="#E8D6AD" opacity=".55">
    <circle cx="90" cy="34" r="1.2"/><circle cx="260" cy="70" r="1"/><circle cx="430" cy="28" r="1.3"/>
    <circle cx="640" cy="52" r=".9"/><circle cx="1010" cy="30" r="1.1"/><circle cx="1130" cy="76" r=".9"/>
  </g>

  <!-- sun on the horizon -->
  <circle cx="930" cy="234" r="150" fill="url(#sun)"/>
  <circle cx="930" cy="236" r="42" fill="#F1C17E" opacity=".92"/>

  <!-- distant islands -->
  <path d="M0 236 Q70 222 130 230 Q190 210 250 226 Q300 214 350 236 Z" fill="#0B2638"/>
  <path d="M1040 236 Q1090 196 1130 204 Q1160 184 1200 206 V236 Z" fill="#0B2638"/>
  <path d="M1158 196 Q1160 176 1155 162 M1155 162 Q1143 157 1134 165 M1155 162 Q1168 155 1178 162 M1155 162 Q1150 170 1146 178" stroke="#0B2638" stroke-width="3" stroke-linecap="round"/>

  <!-- the ship -->
  <g transform="translate(700 176)">
    <path d="M0 56 Q55 70 118 56 L106 70 Q55 78 10 70 Z" fill="#04121E"/>
    <path d="M58 56 V4 M36 56 V20" stroke="#04121E" stroke-width="2.6"/>
    <path d="M60 6 Q96 26 60 50 Z" fill="#04121E"/>
    <path d="M38 22 Q62 36 38 52 Z" fill="#04121E"/>
    <path d="M58 4 l14 4 -14 4" fill="#D97941"/>
  </g>

  <!-- sea -->
  <rect y="236" width="1200" height="84" fill="url(#sea)"/>
  <path d="M0 235.5 H1200" stroke="#C6A15B" stroke-opacity=".4"/>
  <g class="glint" stroke="#F1C17E" stroke-width="2" stroke-linecap="round" stroke-opacity=".6">
    <path d="M850 244 h160 M870 254 h120 M890 264 h80 M905 274 h50"/>
  </g>
  <g class="wave" stroke="#E8D6AD" stroke-opacity=".14" stroke-linecap="round" stroke-width="1.4">
    <path d="M30 262 q24 -6 48 0 t48 0 M260 290 q24 -6 48 0 t48 0 M520 270 q24 -6 48 0 t48 0 M1060 296 q24 -6 48 0 t48 0"/>
  </g>

  <!-- compass rose -->
  <g transform="translate(96 132)" opacity=".85">
    <circle r="46" stroke="#C6A15B" stroke-width="1.5"/>
    <circle r="38" stroke="#C6A15B" stroke-width=".8" stroke-dasharray="1.5 4"/>
    <path d="M0 -44 L6 -6 L0 0 L-6 -6 Z" fill="#D97941"/>
    <path d="M0 44 L-6 6 L0 0 L6 6 Z" fill="#C6A15B"/>
    <path d="M-44 0 L-6 -6 L0 0 L-6 6 Z M44 0 L6 6 L0 0 L6 -6 Z" fill="#C6A15B" opacity=".8"/>
    <circle r="4" fill="#071B2B" stroke="#E8D6AD"/>
    <text y="-54" text-anchor="middle" class="serif" font-size="13" fill="#E8D6AD">N</text>
  </g>

  <!-- title -->
  <text x="600" y="64" text-anchor="middle" class="serif" font-size="14" letter-spacing="7" fill="#C6A15B">THE GRAND LINE · CAPTAIN'S LOG</text>
  <text x="600" y="122" text-anchor="middle" class="serif" font-size="52" font-weight="600" fill="#E8D6AD">Reventh Sathish Kumar</text>
  <path d="M410 142 H790" stroke="#C6A15B" stroke-opacity=".55"/>
  <text x="600" y="170" text-anchor="middle" class="serif" font-size="18" font-style="italic" fill="#E8D6AD" fill-opacity=".85">Computer Science @ UT Dallas  ·  AI / ML Engineer  ·  Software Developer</text>
</svg>
